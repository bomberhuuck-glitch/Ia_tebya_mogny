<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>История Казахстана — полный тест</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --soft:#f8fafc; --primary:#4f46e5; --primary-h:#4338ca; --primary-soft:#eef2ff; --primary-line:#c7d2fe;
    --ok:#059669; --ok-bg:#ecfdf5; --ok-line:#10b981;
    --bad:#dc2626; --bad-bg:#fef2f2; --bad-line:#f87171;
    --shadow:0 10px 30px -12px rgba(15,23,42,.18);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1120; --card:#131c31; --text:#e5e9f2; --muted:#94a3b8; --line:#26324d;
      --soft:#0f1729; --primary:#818cf8; --primary-h:#a5b4fc; --primary-soft:#1b2347; --primary-line:#3b4a8f;
      --ok:#34d399; --ok-bg:#0d2a22; --ok-line:#10b981;
      --bad:#f87171; --bad-bg:#2d1518; --bad-line:#ef4444;
      --shadow:0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45;
  }
  .hidden{display:none !important}
  .app{max-width:860px;margin:0 auto;padding:16px 16px 120px}
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 4px 16px;
  }
  .brand{font-weight:800;font-size:1.05rem;color:var(--primary);display:flex;gap:8px;align-items:center}
  .meta{font-size:.85rem;font-weight:600;color:var(--muted)}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:28px;
  }
  .fade{animation:fade .25s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- Menu ---------- */
  .hero{text-align:center;margin-bottom:22px}
  .hero h1{font-size:1.65rem;font-weight:800;margin-bottom:6px}
  .hero p{color:var(--muted);font-size:.95rem}
  .btn{
    appearance:none;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;
    cursor:pointer;transition:transform .1s,background .15s,opacity .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-h)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:var(--soft);color:var(--text);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--primary)}
  .btn.wide{width:100%}
  @media (prefers-color-scheme: dark){ .btn.primary{color:#0b1120} }

  .section{margin-top:26px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .section-head h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .link{background:none;border:0;color:var(--primary);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;padding:4px 2px}
  .link:hover{text-decoration:underline}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .topic{
    display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;user-select:none;
    background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:14px;
    transition:border-color .15s,background .15s,transform .1s;
  }
  .topic:hover{border-color:var(--primary-line);transform:translateY(-1px)}
  .topic.on{border-color:var(--primary);background:var(--primary-soft)}
  .topic input{margin-top:3px;width:18px;height:18px;accent-color:var(--primary);flex:none;cursor:pointer}
  .topic .t-name{font-weight:700;font-size:.95rem;line-height:1.3}
  .topic .t-count{font-size:.8rem;color:var(--muted);margin-top:2px}

  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--card);border-top:1px solid var(--line);
    box-shadow:0 -8px 24px -12px rgba(15,23,42,.25);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  }
  .bar-in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar-info{flex:1;min-width:150px;font-size:.9rem;color:var(--muted)}
  .bar-info b{color:var(--text)}
  .limit{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
  select{
    font:inherit;font-weight:600;color:var(--text);background:var(--soft);
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;
  }

  /* ---------- Quiz ---------- */
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .progress i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
  .tag{
    display:inline-block;background:var(--primary-soft);color:var(--primary);
    font-size:.74rem;font-weight:800;padding:5px 12px;border-radius:99px;margin-bottom:12px;
  }
  .q{font-size:1.3rem;font-weight:800;line-height:1.35;margin-bottom:20px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--card);color:var(--text);font:inherit;font-weight:600;font-size:.98rem;
    border:2px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);border:1px solid var(--line);
    font-size:.75rem;font-weight:800;color:var(--muted);display:grid;place-items:center;margin-top:1px;
  }
  .opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
  .opt.ok .n,.opt.bad .n{background:transparent;border-color:currentColor;color:inherit}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
  .verdict{font-weight:800;font-size:1.05rem}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .quit{margin-top:18px;text-align:center}
  .hint{font-size:.75rem;color:var(--muted);text-align:center;margin-top:10px}

  /* ---------- Results ---------- */
  .res{text-align:center}
  .ring{
    width:132px;height:132px;border-radius:50%;margin:4px auto 16px;display:grid;place-items:center;
    background:conic-gradient(var(--primary) calc(var(--p) * 1%), var(--line) 0);
  }
  .ring span{
    width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;
    font-size:1.9rem;font-weight:900;color:var(--primary);
  }
  .res h2{font-size:1.5rem;margin-bottom:4px}
  .res .sub{color:var(--muted);margin-bottom:6px}
  .res .msg{margin:12px auto 22px;max-width:460px;font-weight:600}
  .actions{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto}
  details{margin-top:22px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
  summary{cursor:pointer;font-weight:700;padding:14px 16px}
  .miss{padding:0 16px 8px}
  .miss li{list-style:none;padding:12px 0;border-top:1px solid var(--line)}
  .miss .mq{font-weight:700;font-size:.93rem;margin-bottom:3px}
  .miss .ma{font-size:.88rem;color:var(--ok);font-weight:600}
  .miss .mt{font-size:.72rem;color:var(--muted);margin-bottom:2px}

  @media (max-width:600px){
    .card{padding:20px 16px;border-radius:16px}
    .hero h1{font-size:1.4rem}
    .q{font-size:1.15rem}
    .grid{grid-template-columns:1fr}
    .bar-in{gap:8px}
    .limit{order:2}
    .bar .btn{order:3;flex:1}
    .bar-info{flex-basis:100%;order:1}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span>📜</span><span>История Казахстана</span></div>
    <div class="meta hidden" id="quiz-meta"></div>
  </header>

  <!-- ===== MENU ===== -->
  <div id="screen-menu" class="fade">
    <div class="card">
      <div class="hero">
        <h1>Полный тест по истории Казахстана</h1>
        <p id="hero-sub"></p>
      </div>
      <button class="btn primary wide" id="btn-all">Пройти тест по всем темам сразу</button>
      <div id="menu-body"></div>
    </div>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="screen-quiz" class="hidden">
    <div class="card fade">
      <div class="progress"><i id="bar"></i></div>
      <div class="tag" id="q-tag"></div>
      <h2 class="q" id="q-text"></h2>
      <div class="opts" id="q-opts"></div>
      <div class="foot">
        <div class="verdict" id="verdict"></div>
        <button class="btn primary hidden" id="btn-next">Следующий вопрос →</button>
      </div>
      <div class="hint">Подсказка: ответ выбирается клавишами 1–4, дальше — Enter</div>
    </div>
    <div class="quit"><button class="link" id="btn-quit">← Выйти в меню</button></div>
  </div>

  <!-- ===== RESULTS ===== -->
  <div id="screen-results" class="hidden">
    <div class="card res fade">
      <div class="ring" id="ring"><span id="res-pct">0%</span></div>
      <h2 id="res-title">Тест завершён</h2>
      <div class="sub" id="res-sub"></div>
      <p class="msg" id="res-msg"></p>
      <div class="actions">
        <button class="btn primary" id="btn-retry-wrong">Повторить ошибки</button>
        <button class="btn ghost" id="btn-again">Пройти ещё раз</button>
        <button class="btn ghost" id="btn-menu">К выбору тем</button>
      </div>
      <details id="miss-box">
        <summary>Разбор ошибок (<span id="miss-n">0</span>)</summary>
        <ul class="miss" id="miss-list"></ul>
      </details>
    </div>
  </div>
</div>

    <div class="bar" id="bar-menu">
      <div class="bar-in">
        <div class="bar-info" id="sel-info"></div>
        <label class="limit">Вопросов в тесте
          <select id="limit">
            <option value="0">Все</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <button class="btn primary" id="btn-start" disabled>Начать</button>
      </div>
    </div>

<script>
/* Каждая тема: {name, items:[{q, a, o?}]}. Если o нет — варианты ответов подбираются автоматически. */
const DATA = [{"title":"Древность и саки","topics":[{"name":"Каменный век","items":[{"q":"Историческое прошлое человечества по вещественным источникам изучает наука...","o":["Археология","Этнография","Нумизматика","Антропология"],"a":"Археология"},{"q":"Наука, изучающая прошлое человечества по историческим памятникам:","o":["Археология","История","Философия","Социология"],"a":"Археология"},{"q":"Какой период охватывает палеолит?","o":["2,6 млн - 12 тыс. лет до н.э.","12 тыс. лет до н.э - 5 тыс. лет до н.э","5 тыс. лет до н.э - 3 тыс. лет до н.э","3 тыс. лет до н.э - 2 тыс. лет до н.э"],"a":"2,6 млн - 12 тыс. лет до н.э."},{"q":"Какой период охватывает мезолит?","o":["12 тыс. лет до н.э - 5 тыс. лет до н.э","2,6 млн - 12 тыс. лет до н.э.","5 тыс. лет до н.э - 3 тыс. лет до н.э","3 тыс. лет до н.э - 2 тыс. лет до н.э"],"a":"12 тыс. лет до н.э - 5 тыс. лет до н.э"},{"q":"Какой период охватывает неолит?","o":["5 тыс. лет до н.э - 3 тыс. лет до н.э","12 тыс. лет до н.э - 5 тыс. лет до н.э","3 тыс. лет до н.э - 2 тыс. лет до н.э","8-3 тыс. лет до н.э"],"a":"5 тыс. лет до н.э - 3 тыс. лет до н.э"},{"q":"Какой период охватывает энеолит?","o":["3 тыс. лет до н.э - 2 тыс. лет до н.э","5 тыс. лет до н.э - 3 тыс. лет до н.э","12 тыс. лет до н.э - 5 тыс. лет до н.э","V-III тыс. до н.э"],"a":"3 тыс. лет до н.э - 2 тыс. лет до н.э"},{"q":"Основные занятия в палеолите:","o":["Охота и собирательство","Земледелие и скотоводство","Ремёсла и торговля","Ирригация и рыболовство"],"a":"Охота и собирательство"},{"q":"Люди начинают заниматься скотоводством и земледелием в период...","o":["Неолита","Палеолита","Мезолита","Энеолита"],"a":"Неолита"},{"q":"Период, в котором появился производительный труд:","o":["Неолит","Палеолит","Мезолит","Энеолит"],"a":"Неолит"},{"q":"Какой тип хозяйства существовал в эпоху неолита?","o":["Производящий","Присваивающий","Натуральный","Кочевой"],"a":"Производящий"},{"q":"Появление производящего труда в науке называется...","o":["Неолитическая революция","Ариди (function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const ruPlural = (n, f) => { // f = [один, два, много]
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return f[2];
    if (b > 1 && b < 5) return f[1];
    if (b === 1) return f[0];
    return f[2];
  };

  /* ---------- подготовка данных ---------- */
  const topicById = {};
  DATA.forEach((s, si) => s.topics.forEach((t, ti) => {
    t.id = si + '-' + ti;
    topicById[t.id] = t;
    t.items.forEach(it => { it.topic = t.name; it.tid = t.id; });
  }));
  const totalQ = DATA.reduce((n, s) => n + s.topics.reduce((m, t) => m + t.items.length, 0), 0);
  const totalT = DATA.reduce((n, s) => n + s.topics.length, 0);
  $('hero-sub').textContent =
    totalQ + ' ' + ruPlural(totalQ, ['вопрос', 'вопроса', 'вопросов']) + ' · ' +
    totalT + ' ' + ruPlural(totalT, ['тема', 'темы', 'тем']) +
    '. Отметьте одну или несколько тем — или пройдите всё сразу.';

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Варианты для вопросов без готовых вариантов: неверные ответы берём из той же темы,
  // предпочитая похожие по длине и «типу» (числа/даты с числами).
  function makeOptions(it) {
    if (it.o && it.o.length > 1) return shuffle(it.o);
    const hasDigit = s => /\d/.test(s);
    const pool = [...new Set(topicById[it.tid].items.map(x => x.a))].filter(x => x !== it.a);
    const scored = pool.map(x => ({
      x,
      s: Math.abs(x.length - it.a.length) / Math.max(it.a.length, 8) +
         (hasDigit(x) !== hasDigit(it.a) ? 1 : 0) + Math.random() * 0.6
    })).sort((p, q) => p.s - q.s).slice(0, 3).map(p => p.x);
    return shuffle([it.a, ...scored]);
  }

  /* ---------- меню ---------- */
  const selected = new Set();

  function buildMenu() {
    const body = $('menu-body');
    body.innerHTML = '';
    DATA.forEach((sec, si) => {
      const box = document.createElement('div');
      box.className = 'section';
      const head = document.createElement('div');
      head.className = 'section-head';
      const h = document.createElement('h2');
      h.textContent = 'Часть ' + (si + 1) + ' · ' + sec.title;
      const toggle = document.createElement('button');
      toggle.className = 'link';
      toggle.type = 'button';
      head.append(h, toggle);
      const grid = document.createElement('div');
      grid.className = 'grid';

      sec.topics.forEach(t => {
        const lab = document.createElement('label');
        lab.className = 'topic';
        lab.dataset.id = t.id;
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.addEventListener('change', () => {
          cb.checked ? selected.add(t.id) : selected.delete(t.id);
          refresh();
        });
        const txt = document.createElement('div');
        const n = document.createElement('div'); n.className = 't-name'; n.textContent = t.name;
        const c = document.createElement('div'); c.className = 't-count';
        c.textContent = t.items.length + ' ' + ruPlural(t.items.length, ['вопрос', 'вопроса', 'вопросов']);
        txt.append(n, c);
        lab.append(cb, txt);
        grid.appendChild(lab);
      });

      toggle.addEventListener('click', () => {
        const ids = sec.topics.map(t => t.id);
        const allOn = ids.every(id => selected.has(id));
        ids.forEach(id => allOn ? selected.delete(id) : selected.add(id));
        refresh();
      });
      toggle.dataset.sec = si;
      box.append(head, grid);
      body.appendChild(box);
    });
    refresh();
  }

  function refresh() {
    document.querySelectorAll('.topic').forEach(el => {
      const on = selected.has(el.dataset.id);
      el.classList.toggle('on', on);
      el.querySelector('input').checked = on;
    });
    document.querySelectorAll('.section-head .link').forEach(b => {
      const sec = DATA[+b.dataset.sec];
      const allOn = sec.topics.every(t => selected.has(t.id));
      b.textContent = allOn ? 'Снять выбор' : 'Выбрать всё';
    });
    let q = 0;
    selected.forEach(id => q += topicById[id].items.length);
    $('sel-info').innerHTML = selected.size
      ? 'Выбрано: <b>' + selected.size + '</b> ' + ruPlural(selected.size, ['тема', 'темы', 'тем']) +
        ' · <b>' + q + '</b> ' + ruPlural(q, ['вопрос', 'вопроса', 'вопросов'])
      : 'Отметьте темы для теста';
    $('btn-start').disabled = selected.size === 0;
  }

  /* ---------- викторина ---------- */
  let S = null; // состояние

  function show(name) {
    ['menu', 'quiz', 'results'].forEach(n => $('screen-' + n).classList.toggle('hidden', n !== name));
    $('quiz-meta').classList.toggle('hidden', name !== 'quiz');
    $('bar-menu').classList.toggle('hidden', name !== 'menu');
    window.scrollTo({ top: 0 });
  }

  function start(items, title) {
    const limit = +$('limit').value;
    let qs = shuffle(items);
    if (limit > 0 && qs.length > limit) qs = qs.slice(0, limit);
    S = { source: items, title, qs, i: 0, score: 0, wrong: [], answered: false, correct: '' };
    show('quiz');
    load();
  }

  function load() {
    const it = S.qs[S.i];
    S.answered = false;
    S.correct = it.a;
    $('quiz-meta').textContent = 'Вопрос ' + (S.i + 1) + ' из ' + S.qs.length;
    $('bar').style.width = (S.i / S.qs.length * 100) + '%';
    $('q-tag').textContent = it.topic;
    $('q-text').textContent = it.q;
    $('verdict').textContent = '';
    $('verdict').className = 'verdict';
    $('btn-next').classList.add('hidden');
    $('btn-next').textContent = S.i === S.qs.length - 1 ? 'Показать результат →' : 'Следующий вопрос →';

    const box = $('q-opts');
    box.innerHTML = '';
    makeOptions(it).forEach((text, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.dataset.val = text;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = k + 1;
      const t = document.createElement('span'); t.textContent = text;
      b.append(n, t);
      b.addEventListener('click', () => pick(b, text, it));
      box.appendChild(b);
    });
  }

  function pick(btn, text, it) {
    if (S.answered) return;
    S.answered = true;
    const ok = text === it.a;
    document.querySelectorAll('#q-opts .opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.val === it.a) b.classList.add('ok');
    });
    const v = $('verdict');
    if (ok) {
      S.score++;
      v.textContent = '✓ Верно!';
      v.className = 'verdict ok';
    } else {
      btn.classList.add('bad');
      S.wrong.push(it);
      v.textContent = '✗ Неверно';
      v.className = 'verdict bad';
    }
    $('btn-next').classList.remove('hidden');
    $('btn-next').focus({ preventScroll: true });
  }

  function next() {
    S.i++;
    S.i < S.qs.length ? load() : results();
  }

  function results() {
    show('results');
    const total = S.qs.length;
    const pct = Math.round(S.score / total * 100);
    $('ring').style.setProperty('--p', pct);
    $('res-pct').textContent = pct + '%';
    $('res-sub').textContent = 'Правильных ответов: ' + S.score + ' из ' + total + ' · ' + S.title;

    let title, msg;
    if (pct >= 80) {
      title = 'Отличный результат! 🏆';
      msg = 'Материал усвоен очень хорошо. Так держать!';
      if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
    } else if (pct >= 50) {
      title = 'Хорошая работа 👍';
      msg = 'Основа есть. Загляните в разбор ошибок и повторите их.';
    } else {
      title = 'Нужно повторить 📖';
      msg = 'Перечитайте конспект и пройдите тест ещё раз — получится лучше.';
    }
    $('res-title').textContent = title;
    $('res-msg').textContent = msg;

    const wrong = S.wrong;
    $('btn-retry-wrong').classList.toggle('hidden', wrong.length === 0);
    $('btn-retry-wrong').textContent = 'Повторить ошибки (' + wrong.length + ')';
    $('miss-box').classList.toggle('hidden', wrong.length === 0);
    $('miss-box').open = false;
    $('miss-n').textContent = wrong.length;
    const ul = $('miss-list');
    ul.innerHTML = '';
    wrong.forEach(it => {
      const li = document.createElement('li');
      const t = document.createElement('div'); t.className = 'mt'; t.textContent = it.topic;
      const q = document.createElement('div'); q.className = 'mq'; q.textContent = it.q;
      const a = document.createElement('div'); a.className = 'ma'; a.textContent = '✓ ' + it.a;
      li.append(t, q, a);
      ul.appendChild(li);
    });
  }

  /* ---------- запуск ---------- */
  function startSelected() {
    let items = [];
    selected.forEach(id => items = items.concat(topicById[id].items));
    let title;
    if (selected.size === totalT) title = 'Все темы';
    else if (selected.size === 1) title = topicById[[...selected][0]].name;
    else title = 'Выбрано тем: ' + selected.size;
    start(items, title);
  }

  $('btn-all').addEventListener('click', () => {
    DATA.forEach(s => s.topics.forEach(t => selected.add(t.id)));
    refresh();
    startSelected();
  });
  $('btn-start').addEventListener('click', startSelected);
  $('btn-next').addEventListener('click', next);
  $('btn-quit').addEventListener('click', () => show('menu'));
  $('btn-menu').addEventListener('click', () => show('menu'));
  $('btn-again').addEventListener('click', () => start(S.source, S.title));
  $('btn-retry-wrong').addEventListener('click', () => {
    const w = S.wrong.slice();
    const prevLimit = $('limit').value;
    $('limit').value = '0';
    start(w, 'Работа над ошибками');
    $('limit').value = prevLimit;
  });

  document.addEventListener('keydown', e => {
    if ($('screen-quiz').classList.contains('hidden') || !S) return;
    if (e.key >= '1' && e.key <= '9' && !S.answered) {
      const b = document.querySelectorAll('#q-opts .opt')[+e.key - 1];
      if (b) b.click();
    } else if (e.key === 'Enter' && S.answered) {
      e.preventDefault();
      next();
    }
  });

  buildMenu();
})();
</script>
</body>
</html>
